<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>排球專區｜傷害預防與測驗</title>
  <style>
    body { font-family:"Microsoft JhengHei",sans-serif; margin:0; background:#fdfdfd; color:#333; }
    header { background:#e67e22; color:#fff; padding:20px; text-align:center; }
    nav { background:#f39c12; display:flex; justify-content:center; padding:10px; }
    nav a { color:#fff; text-decoration:none; margin:0 20px; font-weight:bold; }
    nav a:hover { text-decoration:underline; }
    main { padding:40px 20px; max-width:900px; margin:auto; }
    section { margin-bottom:40px; }
    .question { background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1); margin-bottom:30px; }
    .feedback { margin-top:10px; font-weight:bold; }
    .correct { color:green; }
    .incorrect { color:red; }
    button { padding:10px 20px; background:#e67e22; color:#fff; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
    #scoreSection { margin-top:40px; padding:20px; background:#f0f0f0; border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <h1>排球專區｜傷害預防與測驗</h1>
    <p>學習排球常見傷害與正確預防方法</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="volleyball.html">排球專區</a>
    <a href="basketball.html">籃球專區</a>
    <a href="quiz.html">測驗問卷</a>
    <a href="ranking.html">排行榜</a>
  </nav>

  <main>
    <section>
      <h2>📘 排球傷害預防知識</h2>
      <ul>
        <li>急性扭傷應立即冰敷並固定，避免熱敷。</li>
        <li>跳躍膝可透過休息與足弓支撐墊減輕負擔。</li>
        <li>落地時膝蓋內扣旋轉容易造成前十字韌帶受傷。</li>
        <li>護膝主要作用是保護膝蓋前方避免跪地擦撞。</li>
        <li>核心訓練能穩定脊椎並傳導力量，減少腰部傷害。</li>
      </ul>
    </section>

    <section>
      <h2>🏐 排球傷害預防測驗</h2>
      <div id="quizContainer"></div>
      <button onclick="submitQuiz()">交卷</button>
      <div id="scoreSection" style="display:none;">
        <h3>🎉 測驗完成！</h3>
        <p id="scoreText"></p>
        <label>請輸入暱稱：</label>
        <input type="text" id="nickname" placeholder="你的名字"/>
        <button onclick="saveScore()">儲存分數並查看排行榜</button>
      </div>
    </section>
  </main>

<script>
  const volleyballQuestions = [
    { q:"攔網落地時不慎踩到對手腳掌，導致腳踝翻船，當下首要處理為何？", options:["強迫走動復健","立即冰敷並固定","用力揉搓患部","繼續比賽"], answer:"立即冰敷並固定", explanation:"急性扭傷應立即冰敷並固定，避免加重傷勢。" },
    { q:"長期跳躍導致膝蓋髕骨下方疼痛（跳躍者膝），初期自我照顧建議為何？", options:["增加跳躍訓練","穿著足弓支撐墊並適度休息","完全不動","只擦痠痛藥膏"], answer:"穿著足弓支撐墊並適度休息", explanation:"休息與支撐墊能減輕膝蓋負擔。" },
    { q:"阿基里斯腱斷裂時，球員通常會感覺到什麼？", options:["膝蓋發軟","腳後跟像被踢到一樣","大腿抽筋","手指麻痺"], answer:"腳後跟像被踢到一樣", explanation:"阿基里斯腱斷裂常有被踢到的感覺。" },
  ];

  let selectedQuestions = [];
  let score = 0;

  function renderQuiz() {
  
    selectedQuestions = volleyballQuestions.sort(() => 0.5 - Math.random()).slice(0,10);
    const container = document.getElementById("quizContainer");
    container.innerHTML = "";
    selectedQuestions.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";
      const title = document.createElement("h3");
      title.textContent = `${index+1}. ${q.q}`;
      div.appendChild(title);
      q.options.forEach(opt => {
        const label = document.createElement("label");
        label.innerHTML = `<input type="radio" name="q${index}" value="${opt}"> ${opt}`;
        div.appendChild(label);
        div.appendChild(document.createElement("br"));
      });
      container.appendChild(div);
    });
  }

  function submitQuiz() {
    score = 0;
    selectedQuestions.forEach((q, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      const div = document.querySelectorAll(".question")[index];
      let feedback = document.createElement("div");
      feedback.className = "feedback";
      if (selected && selected.value === q.answer) {
        score++;
        feedback.textContent = "✅ 答對了！";
        feedback.classList.add("correct");
      } else {
        feedback.textContent = `❌ 答錯了！正確答案是：${q.answer}`;
        feedback.classList.add("incorrect");
      }
      const explain = document.createElement("div");
      explain.textContent = `📘 說明：${q.explanation}`;
      div.appendChild(feedback);
      div.appendChild(explain);
    });
    document.getElementById("scoreSection").style.display = "block";
    document.getElementById("scoreText").textContent = `你獲得 ${score} / ${selectedQuestions.length} 分`;
  }

  function saveScore() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) { alert("請輸入暱稱！"); return; }
    const record = { name:nickname, score:score, topic:"volleyball", time:new Date().toLocaleString() };
    const key = "quizRanking";
    const data = JSON.parse(localStorage.getItem(key)) || [];
    data.push(record);
    data.sort((a,b)=>b.score-a.score);
    localStorage.setItem(key, JSON.stringify(data.slice(0,10)));
    window.location.href = "ranking.html";
  }

  window.onload = renderQuiz;
</script>
</body>
</html>
