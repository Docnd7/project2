<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>互動測驗｜運動傷害預防</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      margin: 0;
      background-color: #fdfdfd;
      color: #333;
      line-height: 1.6;
    }
    header {
      background-color: #e67e22;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #f39c12;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }
    main {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }
    .question {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      border-left: 5px solid #e67e22;
    }
    .question h3 { margin-top: 0; font-size: 1.1em; }
    .type-tag {
      font-size: 0.8em;
      background: #eee;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .option-item {
      display: block;
      margin: 10px 0;
      cursor: pointer;
    }
    .feedback {
      margin-top: 15px;
      padding: 15px;
      border-radius: 4px;
      background: #f1f1f1;
      display: none;
    }
    .correct-text { color: #27ae60; font-weight: bold; }
    .incorrect-text { color: #c0392b; font-weight: bold; }
    
    button {
      padding: 12px 30px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }
    button:hover { background-color: #d35400; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    select { padding: 8px; margin-bottom: 20px; border-radius: 4px; font-size: 1em; }
    #scoreSection {
      margin-top: 40px;
      padding: 30px;
      background: #fff;
      border: 3px solid #e67e22;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>互動測驗｜運動傷害預防</h1>
  <p>挑戰你的正確觀念，減少運動受傷風險！</p>
</header>

<nav>
  <a href="index.html">首頁</a>
  <a href="volleyball.html">排球專區</a>
  <a href="basketball.html">籃球專區</a>
</nav>

<main>
  <div style="text-align: center; margin-bottom: 30px;">
    <label for="topicSelect"><strong>選擇測驗主題：</strong></label>
    <select id="topicSelect" onchange="renderQuiz()">
      <option value="volleyball">🏐 排球測驗</option>
      <option value="basketball">🏀 籃球測驗</option>
    </select>
    <button onclick="renderQuiz()">重新產生測驗</button>
  </div>

  <div id="quizContainer"></div>

  <div id="submitArea" style="text-align: center; margin-top: 20px;">
    <button id="submitBtn" onclick="submitQuiz()">提交所有答案並查看結果</button>
  </div>

  <div id="scoreSection" style="display:none;">
    <h2>🎉 測驗完成！</h2>
    <p id="scoreText" style="font-size: 1.8em; color: #e67e22; font-weight: bold;"></p>
    <button onclick="renderQuiz()">再測一次</button>
  </div>
</main>

<script>

 * ==========================================
 */
const allQuestions = {

      type: "single",

    },
    {
      type: "multi",
      question: "預防肩膀傷害的有效方法有哪些？(多選)",
      options: ["肩胛穩定訓練", "外旋肌訓練", "核心訓練", "減少熱身時間"],
      answer: ["肩胛穩定訓練", "外旋肌訓練", "核心訓練"],

    },

      type: "multi",

      options: ["動態伸展", "關節活動", "技術模擬", "長坐不休"],
      answer: ["動態伸展", "關節活動", "技術模擬"],
      explanation: "熱身應以讓身體「熱起來」並模擬運動動作為主。"
    },

      type: "truefalse",

      options: ["對", "錯"],
      answer: "錯",
      explanation: "運動後伸展有助於肌肉放鬆與代謝廢物排除。"
    },
    {
      type: "single",

      answer: "冰敷固定",

    }
  ],

  // --- 籃球題庫 ---
  basketball: [
    {
      type: "single",

    },

      answer: "核心肌群訓練",

    },

      options: ["對", "錯"],
      answer: "錯",
      explanation: "護具是外在支撐，長期的腳踝穩定性仍須靠肌力訓練。"
    },
    {
      type: "single",
      question: "在場上跌倒手腕撐地受傷，應優先？",
      options: ["揉搓傷處", "冰敷並停止活動", "用力甩手", "繼續運球"],
      answer: "冰敷並停止活動",
      explanation: "手腕撐地易造成骨裂或韌帶撕裂，應立即冰敷並檢查。"
    },
    {
      type: "multi",
      question: "預防籃球運動傷害，日常可以做？(多選)",
      options: ["重量訓練", "本體感覺平衡訓練", "充足的睡眠", "只打比賽不訓練"],
      answer: ["重量訓練", "本體感覺平衡訓練", "充足的睡眠"],
      explanation: "強壯的身體與充足的修復是預防傷害的基礎。"
    },
    {
      type: "truefalse",
      question: "運動前只做靜態拉筋（不動的伸展）就足夠了。",
      options: ["對", "錯"],
      answer: "錯",
      explanation: "運動前應以「動態熱身」為主，靜態伸展反而可能降低肌肉爆發力。"
    },
    {
      type: "single",
      question: "籃球比賽中撞到頭部感到暈眩，應該？",
      options: ["休息一下繼續上場", "立刻停止活動並觀察有無腦震盪", "多喝糖水", "忍耐到比賽結束"],
      answer: "立刻停止活動並觀察有無腦震盪",
      explanation: "頭部外傷不可輕忽，暈眩可能是腦震盪徵兆，必須立即休息。"
    }
  ]
};

/** * ==========================================
 * 程式邏輯區 (請勿隨意修改)
 * ==========================================
 */
let currentQuizData = [];
let userScore = 0;

// 洗牌函數
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

const container = document.getElementById("quizContainer");
const topicSelect = document.getElementById("topicSelect");
const scoreSection = document.getElementById("scoreSection");
const submitBtn = document.getElementById("submitBtn");

window.onload = renderQuiz;

function renderQuiz() {
  const topic = topicSelect.value;
  // 隨機選 10 題並洗牌選項
  const shuffledQuestions = shuffle([...allQuestions[topic]]);
  currentQuizData = shuffledQuestions.slice(0, 10);
  
  container.innerHTML = "";
  scoreSection.style.display = "none";
  submitBtn.disabled = false;

  currentQuizData.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";

    const typeLabel = q.type === "single" ? "單選" : q.type === "multi" ? "多選" : "是非";
    const title = document.createElement("h3");
    title.innerHTML = `<span class="type-tag">${typeLabel}</span>${index + 1}. ${q.question}`;
    div.appendChild(title);

    // 選項洗牌
    const opts = shuffle([...q.options]);
    opts.forEach(opt => {
      const label = document.createElement("label");
      label.className = "option-item";
      const inputType = q.type === "multi" ? "checkbox" : "radio";
      label.innerHTML = `<input type="${inputType}" name="q${index}" value="${opt}"> ${opt}`;
      div.appendChild(label);
    });

    // 解析容器
    const feedbackDiv = document.createElement("div");
    feedbackDiv.className = "feedback";
    feedbackDiv.id = `feedback_${index}`;
    div.appendChild(feedbackDiv);

    container.appendChild(div);
  });
  window.scrollTo(0, 0);
}

function submitQuiz() {
  userScore = 0;
  
  currentQuizData.forEach((q, index) => {
    const feedbackDiv = document.getElementById(`feedback_${index}`);
    const selectedInputs = document.querySelectorAll(`input[name="q${index}"]:checked`);
    const selectedValues = Array.from(selectedInputs).map(i => i.value);
    
    if (selectedValues.length === 0) {
      // 若沒選，預設當作沒選
    }

    let isCorrect = false;
    if (q.type === "multi") {
      isCorrect = selectedValues.length === q.answer.length && selectedValues.every(v => q.answer.includes(v));
    } else {
      isCorrect = selectedValues[0] === q.answer;
    }

    if (isCorrect) userScore++;

    feedbackDiv.style.display = "block";
    const status = isCorrect ? '<span class="correct-text">✅ 正確</span>' : `<span class="incorrect-text">❌ 錯誤</span>`;
    const ans = Array.isArray(q.answer) ? q.answer.join("、") : q.answer;
    
    feedbackDiv.innerHTML = `
      ${status}<br>
      <strong>正確答案：</strong> ${ans}<br>
      <strong>說明：</strong> ${q.explanation}
    `;
  });

  document.getElementById("scoreText").textContent = `您的總分：${userScore * 10} 分 / 100 分`;
  scoreSection.style.display = "block";
  submitBtn.disabled = true;
  scoreSection.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
