<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>互動測驗｜排球與籃球傷害預防</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; background-color: #fdfdfd; color: #333; }
    header { background-color: #e67e22; color: white; padding: 20px; text-align: center; }
    nav { background-color: #f39c12; display: flex; justify-content: center; padding: 10px 0; }
    nav a { color: white; text-decoration: none; margin: 0 20px; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { padding: 40px 20px; max-width: 900px; margin: auto; }
    .question { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .question h3 { margin-top: 0; }
    .feedback { margin-top: 10px; font-weight: bold; }
    .correct { color: green; }
    .incorrect { color: red; }
    button { padding: 10px 20px; background-color: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    select { padding: 8px; margin-bottom: 20px; }
    #scoreSection { margin-top: 40px; padding: 20px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>互動測驗｜排球與籃球傷害預防</h1>
    <p>挑戰你的知識，學習正確觀念！</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="volleyball.html">排球專區</a>
    <a href="basketball.html">籃球專區</a>
    <a href="quiz.html">測驗問卷</a>
    <a href="ranking.html">排行榜</a>
  </nav>

  <main>
    <label for="topicSelect"><strong>選擇測驗主題：</strong></label>
    <select id="topicSelect">
      <option value="volleyball">🏐 排球</option>
      <option value="basketball">🏀 籃球</option>
    </select>

    <div id="quizContainer"></div>

    <div id="scoreSection" style="display:none;">
      <h2>🎉 測驗完成！</h2>
      <p id="scoreText"></p>
      <label>請輸入暱稱：</label>
      <input type="text" id="nickname" placeholder="你的名字" />
      <button onclick="saveScore()">儲存分數並查看排行榜</button>
    </div>
  </main>

<script>
  
  const questions = {
    volleyball: [
      { type: "single", question: "哪一個動作最容易造成腳踝扭傷？", options: ["攔網落地", "發球", "接發球", "站著不動"], answer: "攔網落地", explanation: "攔網落地時若踩到隊友或地面不穩，最容易造成腳踝內翻扭傷。" },
      { type: "truefalse", question: "熱敷適合用在急性扭傷。（對／錯）", answer: "錯", explanation: "急性扭傷應使用冰敷，熱敷會加重腫脹。" }
    ],
    basketball: [
      { type: "single", question: "籃球中哪個動作最容易導致膝蓋扭傷？", options: ["切入變向", "罰球", "傳球", "拍球"], answer: "切入變向", explanation: "切入變向時膝蓋承受大量剪力，容易受傷。" },
      { type: "truefalse", question: "腳踝扭傷後應立即熱敷。（對／錯）", answer: "錯", explanation: "應立即冰敷並避免負重，熱敷會加劇腫脹。" }
    ]
  };

  const container = document.getElementById("quizContainer");
  const topicSelect = document.getElementById("topicSelect");
  const scoreSection = document.getElementById("scoreSection");
  const scoreText = document.getElementById("scoreText");

  let currentTopic = "volleyball";
  let score = 0;
  let total = 0;

  topicSelect.addEventListener("change", renderQuiz);
  window.addEventListener("load", renderQuiz);

  function renderQuiz() {
    currentTopic = topicSelect.value;
    const quiz = questions[currentTopic];
    container.innerHTML = "";
    scoreSection.style.display = "none";
    score = 0;
    total = quiz.length;

    quiz.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";

      const title = document.createElement("h3");
      title.textContent = `${index + 1}. ${q.question}`;
      div.appendChild(title);

      const opts = q.type === "truefalse" ? ["對", "錯"] : q.options;
      if (q.type === "single" || q.type === "truefalse") {
        opts.forEach(opt => {
          const label = document.createElement("label");
          label.innerHTML = `<input type="radio" name="q${index}" value="${opt}"> ${opt}`;
          div.appendChild(label);
          div.appendChild(document.createElement("br"));
        });
      } else if (q.type === "multi") {
        q.options.forEach(opt => {
          const label = document.createElement("label");
          label.innerHTML = `<input type="checkbox" name="q${index}" value="${opt}"> ${opt}`;
          div.appendChild(label);
          div.appendChild(document.createElement("br"));
        });
      }

      container.appendChild(div);
    });

   
    const submitBtn = document.createElement("button");
    submitBtn.textContent = "交卷";
    submitBtn.onclick = submitQuiz;
    container.appendChild(submitBtn);
  }

  function submitQuiz() {
    const quiz = questions[currentTopic];
    score = 0;

    quiz.forEach((q, index) => {
      const div = document.querySelectorAll(".question")[index];
      let correct = false;

      if (q.type === "single" || q.type === "truefalse") {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected) correct = selected.value === q.answer;
      } else if (q.type === "multi") {
        const selected = Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(i => i.value);
        correct = selected.length === q.answer.length && selected.every(val => q.answer.includes(val));
      }

      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.textContent = correct ? "✅ 答對了！" : `❌ 答錯了！正確答案是：${Array.isArray(q.answer) ? q.answer.join("、") : q.answer}`;
      feedback.classList.add(correct ? "correct" : "incorrect");

      const explain = document.createElement("div");
      explain.textContent = `📘 說明：${q.explanation}`;

      div.appendChild(feedback);
      div.appendChild(explain);

      if (correct) score++;
    });

    scoreSection.style.display = "block";
    scoreText.textContent = `你在「${currentTopic === "volleyball" ? "排球" : "籃球"}」測驗中獲得 ${score} / ${total} 分`;
  }

    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname)
